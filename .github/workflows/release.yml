name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release name (for example, v0.3.2)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: Check release state
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Skip an already published tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          fail() {
            echo "$1" >&2
            exit 1
          }
          release_by_tag() {
            gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" | jq -r --arg tag "$RELEASE_TAG" '
              [.[][] | select(.tag_name == $tag)] |
              if length == 0 then ""
              elif length == 1 then
                (.[0] | {
                  databaseId: .id,
                  isDraft: .draft,
                  isPrerelease: .prerelease,
                  targetCommitish: .target_commitish,
                  assets: [.assets[] | {name, size}]
                } | tojson)
              else error("multiple releases use tag " + $tag)
              end
            '
          }

          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || fail "Release tag must be canonical vMAJOR.MINOR.PATCH"
          version="${RELEASE_TAG#v}"
          owner="${GH_REPO%%/*}"
          release_pr_title="chore(main): release $version"
          release_prs="$(gh api --paginate --slurp \
            "repos/$GH_REPO/pulls?state=closed&base=main&head=$owner:release-please--branches--main--components--token-tach&per_page=100")"
          matches="$(jq --arg title "$release_pr_title" '[.[][] | select(.merged_at != null and .title == $title)]' <<<"$release_prs")"
          [[ "$(jq 'length' <<<"$matches")" == 1 ]] || fail "Expected one merged release PR titled '$release_pr_title'"
          release_commit="$(jq -r '.[0].merge_commit_sha' <<<"$matches")"
          [[ "$release_commit" =~ ^[0-9a-f]{40}$ ]] || fail "Release PR has no merge commit"

          release="$(release_by_tag)"
          if [[ -n "$release" ]]; then
            if [[ "$(jq -r '.isDraft' <<<"$release")" == true ]]; then
              [[ "$(jq -r '.isPrerelease' <<<"$release")" == false ]] || fail "$RELEASE_TAG cannot be both draft and prerelease"
              commit="$(jq -r '.targetCommitish' <<<"$release")"
              [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || fail "$RELEASE_TAG draft must target an exact commit, got $commit"
              [[ "$commit" == "$release_commit" ]] || fail "$RELEASE_TAG draft targets $commit, expected release PR merge $release_commit"
            fi
            dmg="token-tach-$version-universal2.dmg"
            provenance="token-tach-$version.intoto.jsonl"
            if [[ "$(jq -r '.isDraft' <<<"$release")" == false ]] && jq -e --arg dmg "$dmg" --arg provenance "$provenance" --arg visibility "$REPO_VISIBILITY" '
              def expected:
                if $visibility == "public" then [$dmg, "SHA256SUMS", $provenance]
                else [$dmg, "SHA256SUMS"] end;
              (.isDraft == false) and
              (.isPrerelease == false) and
              ([.assets[] | .name] | sort) == (expected | sort) and
              all(.assets[]; .size > 0)
            ' <<<"$release" >/dev/null; then
              tag_ref="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '[.object.type, .object.sha] | @tsv')" || fail "$RELEASE_TAG release has no tag"
              IFS=$'\t' read -r tag_type tag_commit <<<"$tag_ref"
              [[ "$tag_type" == commit ]] || fail "$RELEASE_TAG must be a lightweight tag, got $tag_type"
              [[ "$tag_commit" == "$release_commit" ]] || fail "$RELEASE_TAG points to $tag_commit, expected $release_commit"
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              echo "$RELEASE_TAG is already published; skipping macOS release work."
              exit 0
            elif [[ "$(jq -r '.isDraft' <<<"$release")" == false ]]; then
              fail "$RELEASE_TAG exists but its immutable release assets are incomplete; preserve its tag, delete only the release, then rerun: gh release delete $RELEASE_TAG --yes"
            else
              echo "$RELEASE_TAG is a draft at $commit; validating its source."
            fi
          else
            tag_ref="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '[.object.type, .object.sha] | @tsv')" || fail "$RELEASE_TAG has neither a draft release nor an existing tag"
            IFS=$'\t' read -r tag_type commit <<<"$tag_ref"
            [[ "$tag_type" == commit ]] || fail "$RELEASE_TAG must be a lightweight tag, got $tag_type"
            [[ "$commit" == "$release_commit" ]] || fail "$RELEASE_TAG points to $commit, expected release PR merge $release_commit"
          fi

          comparison="$(gh api "repos/$GH_REPO/compare/$commit...main" --jq '.status')"
          [[ "$comparison" == ahead || "$comparison" == identical ]] || fail "Release commit $commit is not on main"
          read_source() {
            gh api "repos/$GH_REPO/contents/$1?ref=$commit" --jq '.content' | tr -d '\n' | base64 --decode
          }
          manifest_version="$(read_source .release-please-manifest.json | jq -r '."."')"
          version_file="$(read_source version.txt | tr -d '[:space:]')"
          app_version="$(read_source app.zon | sed -nE 's/^[[:space:]]*\.version = "([^"]+)".*/\1/p')"
          build_version="$(read_source build.zig.zon | sed -nE 's/^[[:space:]]*\.version = "([^"]+)".*/\1/p')"
          [[ "$manifest_version" == "$version" ]] || fail "Release manifest version $manifest_version does not match $version"
          [[ "$version_file" == "$version" ]] || fail "Release version.txt value $version_file does not match $version"
          [[ "$app_version" == "$version" ]] || fail "Release app.zon version $app_version does not match $version"
          [[ "$build_version" == "$version" ]] || fail "Release build.zig.zon version $build_version does not match $version"

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release commit
    needs: preflight
    if: needs.preflight.outputs.should_publish == 'true'
    runs-on: macos-15
    outputs:
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Validate exact release source and version
        id: tag
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Release tag must be canonical vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          version="$(perl -ne 'print "$1\n" if /^\s*\.version\s*=\s*"([^"]+)"\s*,\s*$/' app.zon)"
          [[ -n "$version" && "$(printf '%s\n' "$version" | wc -l | tr -d ' ')" == 1 ]] || {
            echo "Could not read exactly one canonical version from app.zon" >&2
            exit 1
          }
          manifest_version="$(jq -r '."."' .release-please-manifest.json)"
          version_file="$(tr -d '[:space:]' < version.txt)"
          build_version="$(sed -nE 's/^[[:space:]]*\.version = "([^"]+)".*/\1/p' build.zig.zon)"
          [[ "$manifest_version" == "$version" ]] || {
            echo "Manifest version $manifest_version does not match app.zon version $version" >&2
            exit 1
          }
          [[ "$version_file" == "$version" ]] || {
            echo "version.txt value $version_file does not match app.zon version $version" >&2
            exit 1
          }
          [[ "$build_version" == "$version" ]] || {
            echo "build.zig.zon version $build_version does not match app.zon version $version" >&2
            exit 1
          }
          [[ "$RELEASE_TAG" == "v$version" ]] || {
            echo "Tag $RELEASE_TAG does not match app.zon version $version" >&2
            exit 1
          }
          head_commit="$(git rev-parse HEAD)"
          [[ "$head_commit" == "$EXPECTED_COMMIT" ]] || {
            echo "Checkout $head_commit is not expected commit $EXPECTED_COMMIT" >&2
            exit 1
          }

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$head_commit" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Build Native SDK CLI from vendored fork
        run: cd vendor/native && zig build cli

      - name: Verify source
        run: scripts/verify

  release:
    name: Build and publish
    needs: verify
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Build Native SDK CLI from vendored fork
        run: cd vendor/native && zig build cli

      - name: Revalidate immutable source
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.verify.outputs.commit }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_COMMIT" ]]
          [[ "$RELEASE_TAG" == "v$EXPECTED_VERSION" ]]

      - name: Build and validate Universal 2 ad-hoc release
        shell: bash
        run: |
          set -euo pipefail
          scripts/release --skip-verify --universal

      - name: Stage release artifacts and checksums
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          dmgs=(zig-out/package/*.dmg)
          [[ ${#dmgs[@]} == 1 && -f "${dmgs[0]}" ]]
          cp "${dmgs[0]}" "dist/token-tach-$VERSION-universal2.dmg"
          (cd dist && shasum -a 256 "token-tach-$VERSION-universal2.dmg" > SHA256SUMS)
          (cd dist && shasum -a 256 -c SHA256SUMS)

      - name: Attest release artifacts
        if: github.event.repository.visibility == 'public'
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.dmg
            dist/SHA256SUMS

      - name: Include provenance bundle
        if: github.event.repository.visibility == 'public'
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          [[ -s "$BUNDLE_PATH" ]]
          cp "$BUNDLE_PATH" "dist/token-tach-$VERSION.intoto.jsonl"

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: token-tach-${{ needs.verify.outputs.version }}-${{ needs.verify.outputs.commit }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ needs.verify.outputs.commit }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          tag_ref_if_exists() {
            local output error
            output="$(mktemp)"
            error="$(mktemp)"
            if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '[.object.type, .object.sha] | @tsv' >"$output" 2>"$error"; then
              cat "$output"
            elif ! grep -q 'HTTP 404' "$error"; then
              cat "$error" >&2
              rm -f "$output" "$error"
              return 1
            fi
            rm -f "$output" "$error"
          }
          wait_for_tag_ref() {
            local ref
            for _ in {1..10}; do
              if ! ref="$(tag_ref_if_exists)"; then
                return 1
              fi
              if [[ -n "$ref" ]]; then
                printf '%s\n' "$ref"
                return 0
              fi
              sleep 2
            done
            return 1
          }

          validate_remote_provenance() {
            local owner release_pr_title release_prs matches release_commit comparison
            owner="${GH_REPO%%/*}"
            release_pr_title="chore(main): release $VERSION"
            release_prs="$(gh api --paginate --slurp \
              "repos/$GH_REPO/pulls?state=closed&base=main&head=$owner:release-please--branches--main--components--token-tach&per_page=100")"
            matches="$(jq --arg title "$release_pr_title" '[.[][] | select(.merged_at != null and .title == $title)]' <<<"$release_prs")"
            [[ "$(jq 'length' <<<"$matches")" == 1 ]] || {
              echo "Expected one merged release PR titled '$release_pr_title' at publication" >&2
              return 1
            }
            release_commit="$(jq -r '.[0].merge_commit_sha' <<<"$matches")"
            [[ "$release_commit" == "$EXPECTED_COMMIT" ]] || {
              echo "Release PR moved to $release_commit; expected $EXPECTED_COMMIT" >&2
              return 1
            }
            comparison="$(gh api "repos/$GH_REPO/compare/$EXPECTED_COMMIT...main" --jq '.status')"
            [[ "$comparison" == ahead || "$comparison" == identical ]] || {
              echo "Release commit $EXPECTED_COMMIT is no longer on main" >&2
              return 1
            }
          }
          release_by_tag() {
            gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" | jq -r --arg tag "$RELEASE_TAG" '
              [.[][] | select(.tag_name == $tag)] |
              if length == 0 then ""
              elif length == 1 then
                (.[0] | {
                  databaseId: .id,
                  isDraft: .draft,
                  isPrerelease: .prerelease,
                  targetCommitish: .target_commitish,
                  assets: [.assets[] | {name, size}]
                } | tojson)
              else error("multiple releases use tag " + $tag)
              end
            '
          }

          validate_remote_provenance
          remote_tag_ref="$(tag_ref_if_exists)"
          if [[ -n "$remote_tag_ref" ]]; then
            IFS=$'\t' read -r remote_tag_type remote_tag_sha <<<"$remote_tag_ref"
            [[ "$remote_tag_type" == commit ]] || {
              echo "$RELEASE_TAG must be a lightweight tag, got $remote_tag_type" >&2
              exit 1
            }
            [[ "$remote_tag_sha" == "$EXPECTED_COMMIT" ]] || {
              echo "$RELEASE_TAG points to $remote_tag_sha; expected $EXPECTED_COMMIT" >&2
              exit 1
            }
          fi

          release="$(release_by_tag)"
          if [[ -n "$release" ]]; then
            jq -e --arg commit "$EXPECTED_COMMIT" '
              (.isDraft == true) and
              (.isPrerelease == false) and
              (.targetCommitish == $commit)
            ' <<<"$release" >/dev/null || {
              echo "Published release $RELEASE_TAG already exists; refusing to mutate it" >&2
              exit 1
            }
            gh release upload "$RELEASE_TAG" dist/* --clobber
            release="$(release_by_tag)"
            dmg="token-tach-$VERSION-universal2.dmg"
            provenance="token-tach-$VERSION.intoto.jsonl"
            jq -e --arg commit "$EXPECTED_COMMIT" --arg dmg "$dmg" --arg provenance "$provenance" --arg visibility "${{ github.event.repository.visibility }}" '
              def expected:
                if $visibility == "public" then [$dmg, "SHA256SUMS", $provenance]
                else [$dmg, "SHA256SUMS"] end;
              (.isDraft == true) and
              (.isPrerelease == false) and
              (.targetCommitish == $commit) and
              ([.assets[] | .name] | sort) == (expected | sort) and
              all(.assets[]; .size > 0)
            ' <<<"$release" >/dev/null || {
              echo "$RELEASE_TAG draft changed during artifact upload" >&2
              exit 1
            }
            remote_tag_ref="$(tag_ref_if_exists)"
            if [[ -n "$remote_tag_ref" ]]; then
              IFS=$'\t' read -r remote_tag_type remote_tag_sha <<<"$remote_tag_ref"
              [[ "$remote_tag_type" == commit && "$remote_tag_sha" == "$EXPECTED_COMMIT" ]] || {
                echo "$RELEASE_TAG tag changed during artifact upload" >&2
                exit 1
              }
            fi
            release_id="$(jq -r '.databaseId' <<<"$release")"
            [[ "$release_id" =~ ^[0-9]+$ ]] || {
              echo "$RELEASE_TAG draft has no numeric release ID" >&2
              exit 1
            }
            gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
              -F draft=false \
              -F prerelease=false \
              -f "target_commitish=$EXPECTED_COMMIT" >/dev/null
          else
            [[ -n "$remote_tag_ref" ]] || {
              echo "$RELEASE_TAG has neither a draft release nor an existing tag" >&2
              exit 1
            }
            remote_tag_ref="$(tag_ref_if_exists)"
            IFS=$'\t' read -r remote_tag_type remote_tag_sha <<<"$remote_tag_ref"
            [[ "$remote_tag_type" == commit && "$remote_tag_sha" == "$EXPECTED_COMMIT" ]] || {
              echo "$RELEASE_TAG changed before publication" >&2
              exit 1
            }
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --title "Token Tach $VERSION" --generate-notes
          fi
          remote_tag_ref="$(wait_for_tag_ref)" || {
            echo "$RELEASE_TAG was not visible after publication" >&2
            exit 1
          }
          IFS=$'\t' read -r remote_tag_type remote_tag_sha <<<"$remote_tag_ref"
          [[ "$remote_tag_type" == commit && "$remote_tag_sha" == "$EXPECTED_COMMIT" ]] || {
            echo "$RELEASE_TAG published at $remote_tag_sha; expected $EXPECTED_COMMIT" >&2
            exit 1
          }
          published=false
          for _ in {1..10}; do
            release="$(release_by_tag)"
            if jq -e --arg dmg "token-tach-$VERSION-universal2.dmg" --arg provenance "token-tach-$VERSION.intoto.jsonl" --arg visibility "${{ github.event.repository.visibility }}" '
              def expected:
                if $visibility == "public" then [$dmg, "SHA256SUMS", $provenance]
                else [$dmg, "SHA256SUMS"] end;
              (.isDraft == false) and
              (.isPrerelease == false) and
              ([.assets[] | .name] | sort) == (expected | sort) and
              all(.assets[]; .size > 0)
            ' <<<"$release" >/dev/null; then
              published=true
              break
            fi
            sleep 2
          done
          [[ "$published" == true ]] || {
            echo "$RELEASE_TAG publication state or assets are invalid" >&2
            exit 1
          }

      - name: Update Homebrew tap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN is unset; the tap's hourly release poll will update the cask."
            exit 0
          fi
          sha256="$(shasum -a 256 "dist/token-tach-$VERSION-universal2.dmg" | cut -d ' ' -f 1)"
          gh api --method POST repos/phall1/homebrew-tap/dispatches \
            -f event_type=token-tach-release \
            -F "client_payload[version]=$VERSION" \
            -F "client_payload[sha256]=$sha256"

  continue-release-please:
    name: Continue Release Please
    needs: [preflight, release]
    if: always() && needs.preflight.result == 'success' && (needs.release.result == 'success' || (needs.release.result == 'skipped' && needs.preflight.outputs.should_publish == 'false'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Continue after publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null
          gh workflow run release-please.yml --ref main
