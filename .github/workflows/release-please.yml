name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    # workflow_dispatch can target any ref; only main may groom or publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Maintain draft release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Revalidate an updated ready release PR
        if: steps.release.outputs.prs_created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          number="$(jq -r '.number' <<<"$RELEASE_PR")"
          state="$(gh pr view "$number" --json isDraft,headRefName)"
          if [[ "$(jq -r '.isDraft' <<<"$state")" == "true" ]]; then
            echo "Release PR #$number is draft; CI remains off."
            exit 0
          fi
          head="$(jq -r '.headRefName' <<<"$state")"
          gh workflow run ci.yml --ref "$head" -f ref="$head"
          echo "Dispatched CI for updated ready PR #$number at $head."

      - name: Check out main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Tag and dispatch a merged release PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          fail() {
            echo "$1" >&2
            exit 1
          }

          version="$(tr -d '[:space:]' < version.txt)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || fail "version.txt is not canonical semver"
          manifest_version="$(jq -r '."."' .release-please-manifest.json)"
          [[ "$manifest_version" == "$version" ]] || fail "Manifest version $manifest_version does not match version.txt $version"
          tag="v$version"

          # Release Please uses this stable branch for the release PR. Query its
          # merged PR directly instead of inferring the merge from git history.
          release_pr_title="chore(main): release $version"
          release_prs="$(gh pr list \
            --state merged \
            --base main \
            --head release-please--branches--main--components--token-tach \
            --limit 100 \
            --json number,title,mergeCommit)"
          matches="$(jq --arg title "$release_pr_title" '[.[] | select(.title == $title)]' <<<"$release_prs")"
          [[ "$(jq 'length' <<<"$matches")" == 1 ]] || fail "Expected one merged release PR titled '$release_pr_title'"
          release_pr="$(jq -r '.[0].number' <<<"$matches")"
          release_sha="$(jq -r '.[0].mergeCommit.oid' <<<"$matches")"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]] || fail "Release PR #$release_pr has no merge commit"
          git merge-base --is-ancestor "$release_sha" origin/main || fail "Release commit $release_sha is not on main"

          # With skip-github-release, this workflow owns Release Please's label
          # transition too. Once artifacts are published, mark the merged PR as
          # tagged and rerun Release Please so it can open the next version PR.
          release="$(gh release view "$tag" --json isDraft,assets 2>/dev/null || true)"
          if [[ -n "$release" ]]; then
            tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)" || tag_sha=""
            [[ "$tag_sha" == "$release_sha" ]] || fail "$tag points to $tag_sha, expected $release_sha"
            if [[ "$(jq -r '.isDraft' <<<"$release")" == true ]]; then
              echo "$tag has a draft release at the expected commit; retrying artifact publication."
              gh workflow run release.yml --ref main -f tag="$tag"
              exit 0
            fi

            dmg="token-tach-$version-universal2.dmg"
            provenance="token-tach-$version.intoto.jsonl"
            jq -e --arg dmg "$dmg" --arg provenance "$provenance" --arg visibility "$REPO_VISIBILITY" '
              (.isDraft == false) and
              ([.assets[] | select(.name == $dmg and .size > 0)] | length == 1) and
              ([.assets[] | select(.name == "SHA256SUMS" and .size > 0)] | length == 1) and
              ($visibility != "public" or
                ([.assets[] | select(.name == $provenance and .size > 0)] | length == 1))
            ' <<<"$release" >/dev/null || fail "$tag exists but its immutable release assets are incomplete"

            labels="$(gh pr view "$release_pr" --json labels)"
            pending="$(jq 'any(.labels[]; .name == "autorelease: pending")' <<<"$labels")"
            tagged="$(jq 'any(.labels[]; .name == "autorelease: tagged")' <<<"$labels")"
            if [[ "$pending" == true || "$tagged" != true ]]; then
              gh label create "autorelease: tagged" --color ededed --force
              if [[ "$pending" == true ]]; then
                gh pr edit "$release_pr" \
                  --remove-label "autorelease: pending" \
                  --add-label "autorelease: tagged"
              else
                gh pr edit "$release_pr" --add-label "autorelease: tagged"
              fi
              settled="$(gh pr view "$release_pr" --json labels)"
              jq -e '
                any(.labels[]; .name == "autorelease: tagged") and
                (any(.labels[]; .name == "autorelease: pending") | not)
              ' <<<"$settled" >/dev/null || fail "Release PR #$release_pr label transition did not settle"
              echo "$tag is published; marked release PR #$release_pr as tagged."
              gh workflow run release-please.yml --ref main
            else
              echo "$tag is already published and release PR #$release_pr is settled."
            fi
            exit 0
          fi

          manifest_at_release="$(git show "$release_sha:.release-please-manifest.json" | jq -r '."."')"
          version_file_at_release="$(git show "$release_sha:version.txt" | tr -d '[:space:]')"
          app_at_release="$(git show "$release_sha:app.zon" | sed -nE 's/^[[:space:]]*\.version = \"([^\"]+)\".*/\1/p')"
          build_at_release="$(git show "$release_sha:build.zig.zon" | sed -nE 's/^[[:space:]]*\.version = \"([^\"]+)\".*/\1/p')"
          [[ "$manifest_at_release" == "$version" ]] || fail "Release manifest version $manifest_at_release does not match $version"
          [[ "$version_file_at_release" == "$version" ]] || fail "Release version.txt value $version_file_at_release does not match $version"
          [[ "$app_at_release" == "$version" ]] || fail "Release app.zon version $app_at_release does not match $version"
          [[ "$build_at_release" == "$version" ]] || fail "Release build.zig.zon version $build_at_release does not match $version"

          # The Git ref API rejects this repository's GITHUB_TOKEN. Creating a
          # draft Release is the supported atomic tag bootstrap; release.yml
          # remains the sole publisher and artifact owner.
          gh release create "$tag" \
            --target "$release_sha" \
            --draft \
            --title "Token Tach $version" \
            --generate-notes
          tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')"
          [[ "$tag_sha" == "$release_sha" ]] || fail "$tag was created at $tag_sha, expected $release_sha"
          echo "Created draft $tag at release PR #$release_pr merge $release_sha."

          # GITHUB_TOKEN release creation does not recursively start workflows.
          gh workflow run release.yml --ref main -f tag="$tag"
