name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Maintain draft release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out the release state
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Tag and dispatch a merged release PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(scripts/version current)"
          manifest_version="$(jq -r '."."' .release-please-manifest.json)"
          [[ "$manifest_version" == "$version" ]]
          tag="v$version"

          # Existing published versions are normal on every non-release push.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already published; no release dispatch needed."
            exit 0
          fi

          # release-please owns the version PR; this workflow owns the lightweight
          # tag so the existing artifact publisher remains the sole Release owner.
          if ! gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$tag" \
              -f sha="$GITHUB_SHA" >/dev/null
            echo "Created $tag at $GITHUB_SHA."
          else
            echo "$tag already exists without a published release; retrying dispatch."
          fi

          # GITHUB_TOKEN tag pushes do not recursively start workflows. A
          # workflow_dispatch event is the documented exception, so dispatch the
          # immutable tag publisher explicitly.
          gh workflow run release.yml --ref main -f tag="$tag"
